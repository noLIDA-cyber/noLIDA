<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Forgot Password</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="auth">
  <div class="page" style="display: flex; align-items: center; justify-content: center; padding-top: 0; background: var(--theme-bg-primary);">
    <div style="width: 100%; max-width: 420px; padding: 2rem;">
      <div class="text-center mb-6">
        <a href="/" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; color: var(--theme-text-secondary); text-decoration: none; font-size: var(--text-sm); margin-bottom: 0.75rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Back to Home
        </a>
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 48px; width: auto; margin: 0 auto 1rem;">
        <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); margin-bottom: 0.5rem; color: var(--theme-text-primary);">Forgot Password</h1>
        <p style="color: var(--theme-text-secondary); font-size: var(--text-sm);">Enter your email address and we'll send you a link to reset your password.</p>
      </div>

      <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
        <form id="forgot-password-form">
          <div class="form-group">
            <label class="form-label form-label--required" for="forgot-email">Email</label>
            <input type="email" id="forgot-email" name="email" class="form-input" placeholder="you@example.com" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <button type="submit" class="btn btn--primary btn--block">Send Reset Link</button>
        </form>

        <p class="text-center mt-4" style="font-size: var(--text-sm);">
          <a href="/auth" style="color: var(--theme-accent); font-weight: var(--weight-medium);">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>

    <script src="/config.js"></script>
<script type="module" src="/js/auth.js?v=16"></script>
</body>
</html>
