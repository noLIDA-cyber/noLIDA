<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Verification</title>
  <link rel="stylesheet" href="/css/variables.css?v=19">
  <link rel="stylesheet" href="/css/theme.css?v=19">
  <link rel="stylesheet" href="/css/reset.css?v=19">
  <link rel="stylesheet" href="/css/base.css?v=19">
  <link rel="stylesheet" href="/css/components.css?v=19">
  <link rel="stylesheet" href="/css/utilities.css?v=19">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="verification">
    <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <button id="profile-btn" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem;" aria-label="Account menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">Verification</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Verify your identity and build trust.</p>

      <div id="verification-status" style="margin-bottom: 2rem;">
        <div class="loading-spinner" style="margin: 1rem auto;"></div>
      </div>

      <div id="verification-flow" style="display: none;">
        <div id="step-container"></div>
      </div>
    </div>
  </main>

      <script src="/config.js"></script>
<script type="module">
    const profileBtn = document.getElementById('profile-btn');
    if (profileBtn) {
      profileBtn.addEventListener('click', () => {
        const drawer = document.getElementById('profile-drawer');
        if (drawer) {
          drawer.style.transform = 'translateX(0)';
          const backdrop = document.getElementById('profile-drawer-backdrop');
          if (backdrop) backdrop.classList.remove('hidden');
        } else {
          window.location.href = '/';
        }
      });
    }
  </script>
<script type="module" src="/js/app.js?v=19"></script>
  <script type="module">
    import { isAuthenticated, apiGet, apiPost } from '/js/api.js';

    const showToast = (message, type = 'info', duration = 3000) => {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.style.cssText = 'position: fixed; top: 1rem; right: 1rem; z-index: 400; display: flex; flex-direction: column; gap: 0.5rem;';
        document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.className = 'card';
      const borderColor = type === 'error' ? 'var(--color-danger)' : type === 'success' ? 'var(--color-success)' : 'var(--color-accent)';
      toast.style.cssText = `padding: 0.75rem 1rem; border-left: 4px solid ${borderColor}; box-shadow: var(--shadow-md); font-size: var(--text-sm); color: var(--theme-text-primary);`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, duration);
    };

    const getStatusBadgeClass = (state) => {
      switch (state) {
        case 'approved': return 'badge--primary';
        case 'pending': return 'badge--warning';
        case 'under_review': return 'badge--warning';
        case 'rejected': return 'badge--danger';
        default: return 'badge--secondary';
      }
    };

    let currentVerificationType = null;

    const renderStatus = async () => {
      const statusContainer = document.getElementById('verification-status');
      const flowContainer = document.getElementById('verification-flow');

      try {
        const data = await apiGet('/verification/me/status');
        const status = data.data || {};

        const entries = Object.entries(status);
        if (entries.length > 0) {
          statusContainer.innerHTML = `
            <h3 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Your Verification Status</h3>
            <div class="space-y-2">
              ${entries.map(([type, state]) => `
                <div class="card flex items-center justify-between" style="padding: 1rem;">
                  <div>
                    <p style="font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--theme-text-primary); margin: 0; text-transform: capitalize;">${type}</p>
                    <p style="font-size: var(--text-xs); color: var(--theme-text-tertiary); margin: 0;">Verification</p>
                  </div>
                  <span class="badge ${getStatusBadgeClass(state)}">${state}</span>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          statusContainer.innerHTML = '';
        }

        const hasApproved = Object.values(status).some(s => s === 'approved');
        if (hasApproved) {
          flowContainer.style.display = 'none';
          const banner = document.getElementById('verification-banner');
          if (banner) banner.style.display = 'none';
          const globalBanner = document.getElementById('global-verification-banner');
          if (globalBanner) globalBanner.remove();
        } else {
          flowContainer.style.display = 'block';
          renderTypeSelector();
        }
      } catch (err) {
        statusContainer.innerHTML = `<div class="alert alert--danger">${err.message || 'Failed to load verification status. Please try again.'}</div>`;
      }
    };

    const renderTypeSelector = () => {
      const container = document.getElementById('step-container');
      container.innerHTML = `
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Choose Verification Type</h2>
          <div style="display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
            <button class="btn btn--secondary verification-type-btn" data-type="identity" style="justify-content: flex-start; gap: 0.75rem; padding: 1rem;">
              <span style="font-size: 1.5rem;">??</span>
              <span style="text-align: left;">
                <span style="display: block; font-weight: var(--weight-medium); color: var(--theme-text-primary);">Identity</span>
                <span style="font-size: var(--text-xs); color: var(--theme-text-tertiary);">Passport or National ID</span>
              </span>
            </button>
            <button class="btn btn--secondary verification-type-btn" data-type="phone" style="justify-content: flex-start; gap: 0.75rem; padding: 1rem;">
              <span style="font-size: 1.5rem;">??</span>
              <span style="text-align: left;">
                <span style="display: block; font-weight: var(--weight-medium); color: var(--theme-text-primary);">Phone</span>
                <span style="font-size: var(--text-xs); color: var(--theme-text-tertiary);">Verify via SMS OTP</span>
              </span>
            </button>
            <button class="btn btn--secondary verification-type-btn" data-type="email" style="justify-content: flex-start; gap: 0.75rem; padding: 1rem;">
              <span style="font-size: 1.5rem;">??</span>
              <span style="text-align: left;">
                <span style="display: block; font-weight: var(--weight-medium); color: var(--theme-text-primary);">Email</span>
                <span style="font-size: var(--text-xs); color: var(--theme-text-tertiary);">Verify via email OTP</span>
              </span>
            </button>
          </div>
        </div>
      `;

      container.querySelectorAll('.verification-type-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentVerificationType = btn.dataset.type;
          if (currentVerificationType === 'identity') {
            renderIdentityStep1();
          } else if (currentVerificationType === 'phone') {
            renderPhoneStep1();
          } else if (currentVerificationType === 'email') {
            renderEmailStep1();
          }
        });
      });
    };

    const renderIdentityStep1 = () => {
      const container = document.getElementById('step-container');
      container.innerHTML = `
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <button class="btn btn--ghost btn--sm back-btn" style="color: var(--theme-text-secondary);">? Back</button>
            <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0;">Identity Verification</h2>
          </div>
          <p style="color: var(--theme-text-secondary); font-size: var(--text-sm); margin-bottom: 1rem;">Select your document type.</p>
          <div style="display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
            <button class="btn btn--secondary doc-type-btn" data-doc="passport" style="justify-content: flex-start; gap: 0.75rem; padding: 1rem;">
              <span style="font-size: 1.5rem;">??</span>
              <span style="font-weight: var(--weight-medium); color: var(--theme-text-primary);">Passport</span>
            </button>
            <button class="btn btn--secondary doc-type-btn" data-doc="national_id" style="justify-content: flex-start; gap: 0.75rem; padding: 1rem;">
              <span style="font-size: 1.5rem;">??</span>
              <span style="font-weight: var(--weight-medium); color: var(--theme-text-primary);">National ID</span>
            </button>
            <button class="btn btn--secondary doc-type-btn" data-doc="drivers_license" style="justify-content: flex-start; gap: 0.75rem; padding: 1rem;">
              <span style="font-size: 1.5rem;">??</span>
              <span style="font-weight: var(--weight-medium); color: var(--theme-text-primary);">Driver's License</span>
            </button>
          </div>
        </div>
      `;

      container.querySelector('.back-btn').addEventListener('click', renderTypeSelector);

      container.querySelectorAll('.doc-type-btn').forEach(btn => {
        btn.addEventListener('click', () => renderIdentityStep2(btn.dataset.doc));
      });
    };

    const renderIdentityStep2 = (docType) => {
      const container = document.getElementById('step-container');
      container.innerHTML = `
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <button class="btn btn--ghost btn--sm back-btn" style="color: var(--theme-text-secondary);">? Back</button>
            <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0;">Upload ${docType.replace('_', ' ')}</h2>
          </div>
          <form id="identity-form">
            <div class="form-group">
              <label class="form-label form-label--required" for="doc-file">Document Image</label>
              <input type="file" id="doc-file" name="document" accept="image/*" required class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
              <p style="font-size: var(--text-xs); color: var(--theme-text-tertiary); margin-top: 0.25rem;">Accepted: JPG, PNG, WebP. Max 10MB.</p>
            </div>
            <button type="submit" class="btn btn--primary btn--block">Submit for Verification</button>
          </form>
        </div>
      `;

      container.querySelector('.back-btn').addEventListener('click', () => renderIdentityStep1());

      const form = document.getElementById('identity-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></div> Uploading...';

        try {
          const fileInput = document.getElementById('doc-file');
          const file = fileInput.files[0];

          if (!file) {
            throw new Error('Please select a document image');
          }

          const formData = new FormData();
          formData.append('document', file);

          const token = localStorage.getItem('accessToken');
          const uploadResponse = await fetch('/api/v1/upload/verification-document', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: formData,
          });

          if (!uploadResponse.ok) {
            const data = await uploadResponse.json();
            throw new Error(data.message || 'Failed to upload document');
          }

          const uploadData = await uploadResponse.json();

          await apiPost('/verification', {
            type: 'identity',
            documentUrl: uploadData.url,
            documentCategory: docType,
          });

          showToast('Identity verification submitted successfully', 'success');
          currentVerificationType = null;
          renderStatus();
        } catch (err) {
          showToast(err.message || 'Failed to submit verification', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Submit for Verification';
        }
      });
    };

    const renderPhoneStep1 = () => {
      const container = document.getElementById('step-container');
      container.innerHTML = `
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <button class="btn btn--ghost btn--sm back-btn" style="color: var(--theme-text-secondary);">? Back</button>
            <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0;">Phone Verification</h2>
          </div>
          <p style="color: var(--theme-text-secondary); font-size: var(--text-sm); margin-bottom: 1rem;">Enter your phone number to receive a verification code.</p>
          <form id="phone-send-form">
            <div class="form-group">
              <label class="form-label form-label--required" for="phone-number">Phone Number</label>
              <input type="tel" id="phone-number" name="phone" class="form-input" placeholder="+234 801 234 5678" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            </div>
            <button type="submit" class="btn btn--primary btn--block">Send OTP</button>
          </form>
        </div>
      `;

      container.querySelector('.back-btn').addEventListener('click', renderTypeSelector);

      const form = document.getElementById('phone-send-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></div> Sending...';

        try {
          await apiPost('/verification/phone/send-otp', { phone: form.phone.value });
          showToast('OTP sent to your phone', 'success');
          renderPhoneStep2(form.phone.value);
        } catch (err) {
          showToast(err.message || 'Failed to send OTP', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send OTP';
        }
      });
    };

    const renderPhoneStep2 = (phone) => {
      const container = document.getElementById('step-container');
      container.innerHTML = `
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <button class="btn btn--ghost btn--sm back-btn" style="color: var(--theme-text-secondary);">? Back</button>
            <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0;">Verify Phone</h2>
          </div>
          <p style="color: var(--theme-text-secondary); font-size: var(--text-sm); margin-bottom: 1rem;">Enter the 6-digit code sent to ${phone}</p>
          <form id="phone-verify-form">
            <div class="form-group">
              <label class="form-label form-label--required" for="otp-code">Verification Code</label>
              <input type="text" id="otp-code" name="code" class="form-input" placeholder="123456" maxlength="6" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text); font-size: var(--text-xl); text-align: center; letter-spacing: 0.5em;">
            </div>
            <button type="submit" class="btn btn--primary btn--block">Verify Phone</button>
          </form>
        </div>
      `;

      container.querySelector('.back-btn').addEventListener('click', () => renderPhoneStep1());

      const form = document.getElementById('phone-verify-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></div> Verifying...';

        try {
          await apiPost('/verification/phone/verify-otp', { code: form.code.value });
          showToast('Phone number verified successfully', 'success');
          currentVerificationType = null;
          renderStatus();
        } catch (err) {
          showToast(err.message || 'Invalid verification code', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Verify Phone';
        }
      });
    };

    const renderEmailStep1 = () => {
      const container = document.getElementById('step-container');
      container.innerHTML = `
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <button class="btn btn--ghost btn--sm back-btn" style="color: var(--theme-text-secondary);">? Back</button>
            <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0;">Email Verification</h2>
          </div>
          <p style="color: var(--theme-text-secondary); font-size: var(--text-sm); margin-bottom: 1rem;">We will send a verification code to your email address.</p>
          <form id="email-send-form">
            <div class="form-group">
              <label class="form-label form-label--required" for="email-address">Email Address</label>
              <input type="email" id="email-address" name="email" class="form-input" placeholder="you@example.com" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            </div>
            <button type="submit" class="btn btn--primary btn--block">Send OTP</button>
          </form>
        </div>
      `;

      container.querySelector('.back-btn').addEventListener('click', renderTypeSelector);

      const form = document.getElementById('email-send-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></div> Sending...';

        try {
          await apiPost('/verification/email/send-otp', { email: form.email.value });
          showToast('Verification code sent to your email', 'success');
          renderEmailStep2(form.email.value);
        } catch (err) {
          showToast(err.message || 'Failed to send OTP', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send OTP';
        }
      });
    };

    const renderEmailStep2 = (email) => {
      const container = document.getElementById('step-container');
      container.innerHTML = `
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
            <button class="btn btn--ghost btn--sm back-btn" style="color: var(--theme-text-secondary);">? Back</button>
            <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0;">Verify Email</h2>
          </div>
          <p style="color: var(--theme-text-secondary); font-size: var(--text-sm); margin-bottom: 1rem;">Enter the 6-digit code sent to ${email}</p>
          <form id="email-verify-form">
            <div class="form-group">
              <label class="form-label form-label--required" for="email-otp-code">Verification Code</label>
              <input type="text" id="email-otp-code" name="code" class="form-input" placeholder="123456" maxlength="6" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text); font-size: var(--text-xl); text-align: center; letter-spacing: 0.5em;">
            </div>
            <button type="submit" class="btn btn--primary btn--block">Verify Email</button>
          </form>
        </div>
      `;

      container.querySelector('.back-btn').addEventListener('click', () => renderEmailStep1());

      const form = document.getElementById('email-verify-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></div> Verifying...';

        try {
          await apiPost('/verification/email/verify-otp', { code: form.code.value });
          showToast('Email verified successfully', 'success');
          currentVerificationType = null;
          renderStatus();
        } catch (err) {
          showToast(err.message || 'Invalid verification code', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Verify Email';
        }
      });
    };

    if (!isAuthenticated()) {
      window.location.href = '/auth';
    }

    renderStatus();
  </script>
  <div id="profile-drawer-backdrop" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 998; opacity: 0; transition: opacity 0.3s ease;"></div>
  <aside id="profile-drawer" style="position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 85vw; background: var(--theme-card-bg); border-left: 1px solid var(--theme-border); z-index: 999; transform: translateX(100%); transition: transform 0.3s ease; display: flex; flex-direction: column; box-shadow: var(--shadow-xl);">
    <div style="padding: 1.25rem; border-bottom: 1px solid var(--theme-border); display: flex; align-items: center; justify-content: space-between;">
      <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">Account</h2>
      <button id="close-drawer" class="btn btn--ghost btn--sm" style="color: var(--theme-text-secondary); padding: 0.25rem;" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
