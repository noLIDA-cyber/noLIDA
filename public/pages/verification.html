<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Verification</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="verification">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
            <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <a href="/bookings" class="btn btn--ghost" style="color: var(--theme-text-secondary);">Bookings</a>
        <button id="logout-btn" class="btn btn--secondary btn--sm">Sign Out</button>
      </nav>
    </div>
    </header>

  <main class="page">
    <div id="verification-banner" style="display: none; position: fixed; top: var(--header-height); left: 0; right: 0; background: var(--color-warning); color: var(--color-white); padding: 0.75rem 1rem; text-align: center; font-size: var(--text-sm); font-weight: var(--weight-medium); z-index: 999; box-shadow: var(--shadow-md);">
      Verification pending — complete verification to unlock full platform access.
    </div>
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">Verification</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Verify your identity and build trust.</p>

      <div class="card mb-6" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
        <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Submit Verification</h2>
        <form id="verification-form">
          <div class="form-group">
            <label class="form-label" for="verification-type">Type</label>
            <select id="verification-type" name="type" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
              <option value="identity">Identity</option>
              <option value="business">Business</option>
              <option value="address">Address</option>
              <option value="phone">Phone</option>
              <option value="email">Email</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="verification-doc-type">Document Type</label>
            <input type="text" id="verification-doc-type" name="documentType" class="form-input" placeholder="e.g. National ID, Passport" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <div class="form-group">
            <label class="form-label" for="verification-doc-url">Document URL</label>
            <input type="url" id="verification-doc-url" name="documentUrl" class="form-input" placeholder="https://..." required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <button type="submit" class="btn btn--primary btn--block">Submit Verification</button>
        </form>
      </div>

      <div id="verification-status">
        <h3 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Your Verification Status</h3>
        <div class="loading-spinner" style="margin: 1rem auto;"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js?v=16"></script>
  <script type="module" src="/js/modules/verification.js?v=16"></script>
</body>
</html>
