<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Sign In</title>
  <link rel="stylesheet" href="/css/variables.css?v=18">
  <link rel="stylesheet" href="/css/theme.css?v=18">
  <link rel="stylesheet" href="/css/reset.css?v=18">
  <link rel="stylesheet" href="/css/base.css?v=18">
  <link rel="stylesheet" href="/css/components.css?v=18">
  <link rel="stylesheet" href="/css/utilities.css?v=18">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="auth">
  <div class="page" style="display: flex; align-items: center; justify-content: center; padding-top: 0; background: var(--theme-bg-primary);">
    <div style="width: 100%; max-width: 420px; padding: 2rem;">
      <div class="text-center mb-6">
        <a href="/" style="display: inline-flex; align-items: center; justify-content: center; gap: 0.25rem; color: var(--theme-text-secondary); text-decoration: none; font-size: var(--text-sm); margin-bottom: 0.75rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Back to Home
        </a>
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 48px; width: auto; margin: 0 auto 1rem;">
        <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); margin-bottom: 0.5rem; color: var(--theme-text-primary);">Sign In</h1>
        <p style="color: var(--theme-text-secondary); font-size: var(--text-sm);">Welcome back. Enter your credentials to access your account.</p>
      </div>

      <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label form-label--required" for="login-email">Email</label>
            <input type="email" id="login-email" name="email" class="form-input" placeholder="you@example.com" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <div class="form-group">
            <label class="form-label form-label--required" for="login-password">Password</label>
            <div style="position: relative;">
              <input type="password" id="login-password" name="password" class="form-input" placeholder="Enter your password" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text); padding-right: 2.5rem;">
              <button type="button" class="password-toggle" data-target="login-password" aria-label="Toggle password visibility" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 0.25rem; color: var(--theme-text-secondary);">
                <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="eye-closed hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn--primary btn--block">Sign In</button>
        </form>

        <div class="divider"></div>

        <button type="button" class="btn btn--secondary btn--block" id="google-signin" style="border-color: var(--theme-border); color: var(--theme-text-primary); background: var(--theme-bg-secondary);">Continue with Google</button>
        <button type="button" class="btn btn--secondary btn--block" id="apple-signin" style="border-color: var(--theme-border); color: var(--theme-text-primary); background: var(--theme-bg-secondary); margin-top: 0.75rem;">Continue with Apple</button>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; font-size: var(--text-sm);">
          <a href="/forgot-password" style="color: var(--theme-accent);">Forgot password?</a>
          <a href="/register" style="color: var(--theme-accent);">Create account</a>
        </div>
      </div>
    </div>
  </div>

    <script src="/config.js"></script>
<script type="module" src="/js/auth.js?v=18"></script>
</body>
</html>
