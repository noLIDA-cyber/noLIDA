<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Organization Detail</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="organizations">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/organizations" class="btn btn--ghost" style="color: var(--theme-text-secondary);">← Organizations</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
      <div id="org-details">
        <div class="loading-spinner" style="margin: 2rem auto;"></div>
      </div>

      <div id="members-section" style="margin-top: 2rem; display: none;">
        <div class="flex items-center justify-between mb-4">
          <h2 style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">Staff & Roles</h2>
          <button id="add-member-btn" class="btn btn--primary btn--sm">Add Staff</button>
        </div>
        <div id="members-list"></div>
      </div>
    </div>
  </main>

  <div id="member-modal" class="modal hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: var(--z-modal); display: none; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 1.5rem; background: var(--theme-card-bg); border-color: var(--theme-border);">
      <div class="flex items-center justify-between mb-4">
        <h3 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">Add Staff Member</h3>
        <button id="close-member-modal" class="btn btn--ghost btn--sm" style="color: var(--theme-text-secondary);">✕</button>
      </div>
      <form id="member-form">
        <div class="form-group">
          <label class="form-label form-label--required" for="member-email">Email</label>
          <input type="email" id="member-email" name="email" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
        </div>
        <div class="form-group">
          <label class="form-label form-label--required" for="member-role">Role</label>
          <select id="member-role" name="roleId" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            <option value="">Select a role</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary btn--block mt-4">Add Staff</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/app.js?v=16"></script>
  <script type="module">
    import { apiGet, apiPost, apiDelete, isAuthenticated } from '/js/api.js';
    import { showToast } from '/js/app.js';

    if (!isAuthenticated()) {
      window.location.href = '/auth';
    }

    const pathParts = window.location.pathname.split('/');
    const orgId = pathParts[2];

    const detailsEl = document.getElementById('org-details');
    const membersSection = document.getElementById('members-section');
    const membersList = document.getElementById('members-list');
    const addMemberBtn = document.getElementById('add-member-btn');
    const memberModal = document.getElementById('member-modal');
    const closeMemberModal = document.getElementById('close-member-modal');
    const memberForm = document.getElementById('member-form');
    const memberRoleSelect = document.getElementById('member-role');

    const loadOrg = async () => {
      try {
        const [orgData, membersData, rolesData, statsData] = await Promise.all([
          apiGet(`/organizations/${orgId}`),
          apiGet(`/organizations/${orgId}/members`),
          apiGet('/organizations/roles/all'),
          apiGet(`/organizations/${orgId}/stats`).catch(() => ({ data: null })),
        ]);

        const org = orgData.data;
        const members = membersData.data || [];
        const roles = rolesData.data || [];
        const stats = statsData.data;

        detailsEl.innerHTML = `
          <div class="card" style="margin-bottom: 2rem;">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
              <div>
                <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">${org.name}</h1>
                <p style="color: var(--theme-text-secondary); margin-bottom: 0.5rem;">${org.type} · ${org.role_name}</p>
                <p style="color: var(--theme-text-tertiary); font-size: var(--text-sm);">${org.description || 'No description'}</p>
              </div>
              <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn--secondary btn--sm" onclick="alert('Edit coming soon')">Edit</button>
                <button class="btn btn--secondary btn--sm" style="color: var(--color-danger);" onclick="alert('Delete coming soon')">Delete</button>
              </div>
            </div>
          </div>

          <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
            <div class="card" style="border-left: 4px solid var(--color-accent);">
              <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin-bottom: 0.25rem;">Members</p>
              <p style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">${stats?.members || members.length}</p>
            </div>
            <div class="card" style="border-left: 4px solid var(--color-purple);">
              <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin-bottom: 0.25rem;">Listings</p>
              <p style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">${stats?.listings || 0}</p>
            </div>
            <div class="card" style="border-left: 4px solid var(--color-pink);">
              <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin-bottom: 0.25rem;">Bookings (30d)</p>
              <p style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">${stats?.bookings || 0}</p>
            </div>
          </div>
        `;

        membersSection.style.display = 'block';

        memberRoleSelect.innerHTML = '<option value="">Select a role</option>' +
          roles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');

        if (members.length === 0) {
          membersList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">👥</div>
              <p class="empty-state__title">No staff members yet</p>
              <p class="empty-state__description">Add staff members to your organization.</p>
            </div>`;
          return;
        }

        membersList.innerHTML = `
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: var(--text-sm);">
              <thead>
                <tr style="border-bottom: 1px solid var(--theme-border);">
                  <th style="text-align: left; padding: 0.5rem; color: var(--theme-text-secondary); font-weight: var(--weight-medium);">Member</th>
                  <th style="text-align: left; padding: 0.5rem; color: var(--theme-text-secondary); font-weight: var(--weight-medium);">Email</th>
                  <th style="text-align: left; padding: 0.5rem; color: var(--theme-text-secondary); font-weight: var(--weight-medium);">Role</th>
                  <th style="text-align: right; padding: 0.5rem; color: var(--theme-text-secondary); font-weight: var(--weight-medium);">Action</th>
                </tr>
              </thead>
              <tbody>
                ${members.map(m => `
                  <tr style="border-bottom: 1px solid var(--theme-border);">
                    <td style="padding: 0.75rem 0.5rem; color: var(--theme-text-primary); font-weight: var(--weight-medium);">${m.display_name || m.first_name || 'User'}</td>
                    <td style="padding: 0.75rem 0.5rem; color: var(--theme-text-secondary);">${m.email}</td>
                    <td style="padding: 0.75rem 0.5rem; color: var(--theme-text-secondary);"><span class="badge badge--primary">${m.role_name}</span></td>
                    <td style="padding: 0.75rem 0.5rem; text-align: right;">
                      <button class="btn btn--ghost btn--sm remove-member" data-id="${m.id}" style="color: var(--color-danger);">Remove</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;

        membersList.querySelectorAll('.remove-member').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Remove this staff member?')) return;
            try {
              await apiDelete(`/organizations/${orgId}/members/${btn.dataset.id}`);
              showToast('Member removed', 'success');
              loadOrg();
            } catch (error) {
              showToast(error.message || 'Failed to remove member', 'error');
            }
          });
        });
      } catch (error) {
        detailsEl.innerHTML = `<div class="alert alert--danger">${error.message}</div>`;
      }
    };

    if (addMemberBtn) {
      addMemberBtn.addEventListener('click', () => {
        memberModal.style.display = 'flex';
      });
    }

    if (closeMemberModal) {
      closeMemberModal.addEventListener('click', () => {
        memberModal.style.display = 'none';
      });
    }

    if (memberModal) {
      memberModal.addEventListener('click', (e) => {
        if (e.target === memberModal) memberModal.style.display = 'none';
      });
    }

    if (memberForm) {
      memberForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(memberForm);
        const btn = memberForm.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = 'Adding...';

        try {
          await apiPost(`/organizations/${orgId}/members`, {
            email: formData.get('email'),
            roleId: parseInt(formData.get('roleId')),
          });
          showToast('Staff member added', 'success');
          memberForm.reset();
          memberModal.style.display = 'none';
          loadOrg();
        } catch (error) {
          showToast(error.message || 'Failed to add member', 'error');
        } finally {
          btn.disabled = false;
          btn.innerHTML = 'Add Staff';
        }
      });
    }

    loadOrg();
  </script>
</body>
</html>
