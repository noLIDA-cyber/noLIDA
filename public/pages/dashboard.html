<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Provider Dashboard</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="dashboard">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/bookings" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">Bookings</a>
        <a href="/settings" class="btn btn--ghost" style="color: var(--theme-text-secondary);">Settings</a>
                <button id="profile-btn" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem;" aria-label="Account menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
<button id="logout-btn" class="btn btn--secondary btn--sm">Sign Out</button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); margin-bottom: 0.5rem; color: var(--theme-text-primary);">Provider Dashboard</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Manage your services, schedule, and bookings.</p>

      <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
        <div class="card" style="border-left: 4px solid var(--color-accent); background: var(--theme-card-bg); border-color: var(--theme-border);">
          <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin-bottom: 0.25rem;">Total Revenue</p>
          <p style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);" id="stat-revenue">--</p>
        </div>
        <div class="card" style="border-left: 4px solid var(--color-purple); background: var(--theme-card-bg); border-color: var(--theme-border);">
          <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin-bottom: 0.25rem;">Bookings (30d)</p>
          <p style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);" id="stat-bookings">--</p>
        </div>
        <div class="card" style="border-left: 4px solid var(--color-pink); background: var(--theme-card-bg); border-color: var(--theme-border);">
          <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin-bottom: 0.25rem;">Active Listings</p>
          <p style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);" id="stat-listings">--</p>
        </div>
        <div class="card" style="border-left: 4px solid var(--color-success); background: var(--theme-card-bg); border-color: var(--theme-border);">
          <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin-bottom: 0.25rem;">Avg Rating</p>
          <p style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);" id="stat-rating">--</p>
        </div>
      </div>

      <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
        <div class="card" style="background: var(--theme-card-bg); border-color: var(--theme-border);">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); margin-bottom: 1rem; color: var(--theme-text-primary);">Upcoming Bookings</h2>
          <div id="upcoming-list">
            <div class="empty-state">
              <div class="empty-state__icon">📅</div>
              <p class="empty-state__title">Loading...</p>
            </div>
          </div>
        </div>

        <div class="card" style="background: var(--theme-card-bg); border-color: var(--theme-border);">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); margin-bottom: 1rem; color: var(--theme-text-primary);">Weekly Schedule</h2>
          <div id="calendar-container" style="overflow-x: auto;">
            <div id="calendar-grid" style="display: grid; grid-template-columns: 60px repeat(7, 1fr); gap: 1px; background: var(--theme-border); border: 1px solid var(--theme-border); border-radius: var(--radius-md); overflow: hidden;"></div>
          </div>
        </div>
      </div>

      <div class="card" style="background: var(--theme-card-bg); border-color: var(--theme-border); margin-bottom: 2rem;">
        <div class="flex items-center justify-between mb-4">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">Availability</h2>
          <button id="add-availability-btn" class="btn btn--primary btn--sm">Add Availability</button>
        </div>
        <div id="availability-list" style="overflow-x: auto;">
          <div class="empty-state">
            <div class="empty-state__icon">🕐</div>
            <p class="empty-state__title">Loading...</p>
          </div>
        </div>
      </div>

      <div class="card" style="background: var(--theme-card-bg); border-color: var(--theme-border);">
        <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); margin-bottom: 1rem; color: var(--theme-text-primary);">My Listings</h2>
        <div id="listings-list">
          <div class="empty-state">
            <div class="empty-state__icon">📦</div>
            <p class="empty-state__title">Loading...</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="availability-modal" class="modal hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: var(--z-modal); display: none; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 1.5rem; background: var(--theme-card-bg); border-color: var(--theme-border);">
      <div class="flex items-center justify-between mb-4">
        <h3 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">Add Availability</h3>
        <button id="close-modal" class="btn btn--ghost btn--sm" style="color: var(--theme-text-secondary);">✕</button>
      </div>
      <form id="availability-form">
        <div class="form-group">
          <label class="form-label" for="av-listing">Listing</label>
          <select id="av-listing" name="listingId" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            <option value="">Select a listing</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="av-day">Day of Week</label>
          <select id="av-day" name="day_of_week" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            <option value="0">Sunday</option>
            <option value="1" selected>Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
        </div>
        <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="av-start">Start Time</label>
            <input type="time" id="av-start" name="start_time" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <div class="form-group">
            <label class="form-label" for="av-end">End Time</label>
            <input type="time" id="av-end" name="end_time" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
        </div>
        <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="av-break-start">Break Start</label>
            <input type="time" id="av-break-start" name="break_start" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <div class="form-group">
            <label class="form-label" for="av-break-end">Break End</label>
            <input type="time" id="av-break-end" name="break_end" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
        </div>
        <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="av-max">Max Bookings/Slot</label>
            <input type="number" id="av-max" name="max_bookings_per_slot" value="1" min="1" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <div class="form-group">
            <label class="form-label" for="av-buffer">Buffer (min)</label>
            <input type="number" id="av-buffer" name="buffer_time" value="0" min="0" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--block mt-4">Save Availability</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/provider.js?v=16"></script>

  <script type="module">
    const profileBtn = document.getElementById('profile-btn');
    if (profileBtn) {
      profileBtn.addEventListener('click', () => {
        const drawer = document.getElementById('profile-drawer');
        if (drawer) {
          drawer.style.transform = 'translateX(0)';
          const backdrop = document.getElementById('profile-drawer-backdrop');
          if (backdrop) backdrop.classList.remove('hidden');
        } else {
          window.location.href = '/';
        }
      });
    }
  </script>
</body>
</html>
