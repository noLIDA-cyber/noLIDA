<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — My Bookings</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="bookings">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
            <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <a href="/cart" class="btn btn--ghost" style="color: var(--theme-text-secondary);">Cart</a>
        <button id="logout-btn" class="btn btn--secondary btn--sm">Sign Out</button>
      </nav>
    </div>
    </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">My Bookings</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Manage your appointments and reservations.</p>

      <div id="bookings-list">
        <div class="loading-spinner" style="margin: 2rem auto;"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js?v=16"></script>
  <script type="module">
    import { isAuthenticated, apiGet } from '/js/api.js';

    if (!isAuthenticated()) {
      window.location.href = '/auth';
    }

    const container = document.getElementById('bookings-list');

    const renderBookings = (bookings) => {
      if (!bookings || bookings.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">📅</div>
            <p class="empty-state__title">No bookings yet</p>
            <p class="empty-state__description">Start by exploring services and making a booking.</p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="space-y-4">
          ${bookings.map(booking => `
            <div class="card" style="border-left: 4px solid var(--color-accent);">
              <div class="flex items-center justify-between" style="margin-bottom: 0.75rem;">
                <div>
                  <h3 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0;">${booking.listing_title || 'Untitled Booking'}</h3>
                  <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin: 0;">${booking.category_name || 'General'}</p>
                </div>
                <span class="badge badge--primary">${booking.transaction_status}</span>
              </div>
              <div style="font-size: var(--text-sm); color: var(--theme-text-secondary);">
                <p>Provider: ${booking.provider_name || 'Independent'}</p>
                <p>Organization: ${booking.organization_name || 'N/A'}</p>
                <p>Total: ${new Intl.NumberFormat('en-NG', { style: 'currency', currency: booking.currency || 'NGN' }).format(booking.total_amount || 0)}</p>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    };

    apiGet('/bookings?role=customer')
      .then(data => renderBookings(data.data))
      .catch(err => {
        container.innerHTML = `<div class="alert alert--danger">${err.message}</div>`;
      });
  </script>
</body>
</html>
