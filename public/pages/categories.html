<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Categories</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="categories">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <a href="/auth" class="btn btn--primary btn--sm">Sign In</a>
      </nav>
    </div>
    </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">Categories</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Browse services and providers by category.</p>

      <div id="categories-grid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem;">
        <div class="loading-spinner" style="grid-column: 1 / -1; margin: 2rem auto;"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js?v=16"></script>
  <script type="module">
    import { apiGet } from '/js/api.js';

    const grid = document.getElementById('categories-grid');

    const renderCategories = (categories) => {
      if (!categories || categories.length === 0) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-state__icon">📂</div>
            <p class="empty-state__title">No categories yet</p>
            <p class="empty-state__description">Check back later for new categories.</p>
          </div>`;
        return;
      }

      grid.innerHTML = categories.map(cat => `
        <a href="/search?categoryId=${cat.id}" class="card card--interactive" style="text-decoration: none; display: flex; flex-direction: column; gap: 0.75rem;">
          <div style="font-size: 2.5rem;">${cat.icon || '📂'}</div>
          <div>
            <h3 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">${cat.name}</h3>
            <p style="font-size: var(--text-sm); color: var(--theme-text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${cat.description || ''}</p>
          </div>
        </a>
      `).join('');
    };

    apiGet('/categories')
      .then(data => renderCategories(data.data))
      .catch(err => {
        grid.innerHTML = `<div class="alert alert--danger">${err.message}</div>`;
      });
  </script>
</body>
</html>
