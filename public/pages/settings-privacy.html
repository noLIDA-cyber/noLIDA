<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Privacy Settings</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="settings">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/settings" class="btn btn--ghost" style="color: var(--theme-text-secondary);">← Back to Settings</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem; max-width: 680px;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">Privacy</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Control your privacy and data preferences.</p>

      <div class="space-y-4">
        <div class="card">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Profile Visibility</h2>
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span style="color: var(--theme-text-primary); font-size: var(--text-sm);">Public profile</span>
              <label class="theme-toggle-switch">
                <input type="checkbox" checked>
                <span class="theme-toggle-track"></span>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <span style="color: var(--theme-text-primary); font-size: var(--text-sm);">Show activity status</span>
              <label class="theme-toggle-switch">
                <input type="checkbox" checked>
                <span class="theme-toggle-track"></span>
              </label>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Data & Personalization</h2>
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span style="color: var(--theme-text-primary); font-size: var(--text-sm);">Personalized recommendations</span>
              <label class="theme-toggle-switch">
                <input type="checkbox">
                <span class="theme-toggle-track"></span>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <span style="color: var(--theme-text-primary); font-size: var(--text-sm);">Location-based services</span>
              <label class="theme-toggle-switch">
                <input type="checkbox" checked>
                <span class="theme-toggle-track"></span>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <span style="color: var(--theme-text-primary); font-size: var(--text-sm);">Analytics and improvements</span>
              <label class="theme-toggle-switch">
                <input type="checkbox">
                <span class="theme-toggle-track"></span>
              </label>
            </div>
          </div>
        </div>

        <div class="card">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Data Controls</h2>
          <div class="space-y-3">
            <button class="btn btn--secondary btn--block" onclick="alert('Feature coming soon')">Download My Data</button>
            <button class="btn btn--secondary btn--block" onclick="alert('Feature coming soon')">Request Data Deletion</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
