<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Search</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="search">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <span id="nav-guest">
          <a href="/auth" class="btn btn--primary btn--sm">Sign In</a>
        </span>
        <span id="nav-auth" class="hidden">
          <a href="/bookings" class="btn btn--ghost" style="color: var(--theme-text-secondary);">Bookings</a>
          <a href="/cart" class="btn btn--ghost" style="color: var(--theme-text-secondary);">Cart</a>
          <button id="logout-btn" class="btn btn--secondary btn--sm">Sign Out</button>
        </span>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem;">
      <div class="text-center mb-6">
        <h1 style="font-size: var(--text-3xl); font-weight: var(--weight-bold); margin-bottom: 1rem; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Find what you need</h1>
        <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Search across thousands of services, products, and professionals.</p>
      </div>

      <div class="card" style="max-width: 640px; margin: 0 auto 2rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
        <form id="search-form">
          <div class="form-group" style="margin-bottom: 0.75rem;">
            <input type="text" id="search-query" class="form-input" placeholder="Try: I need a plumber in Lagos under 5000" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <div class="flex gap-2">
            <input type="text" id="search-location" class="form-input" placeholder="Location" style="flex: 1; background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            <button type="submit" class="btn btn--primary">Search</button>
          </div>
        </form>
        <div class="text-center mt-3">
          <button id="request-btn" class="btn btn--secondary btn--sm" style="display: none;">Can't find what you need? Make a request</button>
        </div>
      </div>

      <div id="search-results">
        <div class="empty-state">
          <div class="empty-state__icon">🔍</div>
          <p class="empty-state__title">Start searching</p>
          <p class="empty-state__description">Enter what you need above to discover providers.</p>
        </div>
      </div>
    </div>
  </main>

  <div id="request-modal" class="modal hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: var(--z-modal); display: none; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 480px; padding: 1.5rem; background: var(--theme-card-bg); border-color: var(--theme-border);">
      <div class="flex items-center justify-between mb-4">
        <h3 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">Make a Service Request</h3>
        <button id="close-request-modal" class="btn btn--ghost btn--sm" style="color: var(--theme-text-secondary);">✕</button>
      </div>
      <form id="request-form">
        <div class="form-group">
          <label class="form-label form-label--required" for="req-title">What do you need?</label>
          <input type="text" id="req-title" name="title" class="form-input" placeholder="e.g. Plumbing repair" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
        </div>
        <div class="form-group">
          <label class="form-label" for="req-description">Details</label>
          <textarea id="req-description" name="description" rows="3" class="form-input" placeholder="Describe what you need..." style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="req-location">Location</label>
          <input type="text" id="req-location" name="location" class="form-input" placeholder="e.g. Lagos" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
        </div>
        <div class="grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="req-budget-min">Min Budget (NGN)</label>
            <input type="number" id="req-budget-min" name="budgetMin" class="form-input" placeholder="5000" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
          <div class="form-group">
            <label class="form-label" for="req-budget-max">Max Budget (NGN)</label>
            <input type="number" id="req-budget-max" name="budgetMax" class="form-input" placeholder="20000" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="req-urgency">Urgency</label>
          <select id="req-urgency" name="urgency" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <button type="submit" class="btn btn--primary btn--block mt-4">Submit Request</button>
      </form>
    </div>
  </div>

  <script type="module" src="/js/search.js?v=16"></script>
</body>
</html>
