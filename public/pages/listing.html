<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Listing</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="listing">
    <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <button id="profile-btn" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem;" aria-label="Account menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem; max-width: 800px;">
      <div id="listing-details">
        <div class="loading-spinner" style="margin: 3rem auto;"></div>
      </div>
    </div>
  </main>

    <script src="/config.js"></script>
<script type="module" src="/js/app.js?v=16"></script>
  <script type="module">
    import { apiGet } from '/js/api.js';

    const container = document.getElementById('listing-details');
    const pathParts = window.location.pathname.split('/');
    const listingId = pathParts[pathParts.length - 1];

    const renderListing = (listing) => {
      if (!listing) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">😕</div>
            <p class="empty-state__title">Listing not found</p>
            <p class="empty-state__description">This listing may have been removed or is no longer active.</p>
          </div>`;
        return;
      }

      const priceDisplay = listing.pricing_type === 'fixed' && listing.base_price
        ? `₦${Number(listing.base_price).toLocaleString()}`
        : listing.pricing_type === 'range' && listing.min_price && listing.max_price
        ? `₦${Number(listing.min_price).toLocaleString()} - ₦${Number(listing.max_price).toLocaleString()}`
        : listing.pricing_type === 'hourly'
        ? `₦${Number(listing.base_price).toLocaleString()} / hour`
        : 'Contact for price';

      container.innerHTML = `
        <div class="card" style="margin-bottom: 1.5rem;">
          <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;">
            <div class="avatar">${listing.business_name ? listing.business_name[0] : '?'}</div>
            <div>
              <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin: 0;">${listing.title}</h1>
              <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin: 0;">${listing.business_name || listing.provider_name || 'Independent Provider'} · ${listing.category_name || 'General'}</p>
            </div>
          </div>
          <p style="color: var(--theme-text-secondary); line-height: var(--leading-relaxed); margin-bottom: 1.5rem;">${listing.description || 'No description provided.'}</p>
          <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;">
            <span class="badge ${listing.verified ? 'badge--success' : 'badge--primary'}">${listing.verified ? 'Verified' : 'Unverified'}</span>
            <span style="font-size: var(--text-lg); font-weight: var(--weight-bold); color: var(--theme-accent);">${priceDisplay}</span>
            <a href="/book/new?listingId=${listing.id}" class="btn btn--primary" style="margin-top: 0.5rem;">Book Now</a>
          </div>
        </div>
        <div class="card">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Availability</h2>
          <div id="availability-list">
            <p style="color: var(--theme-text-secondary);">Loading availability...</p>
          </div>
        </div>
      `;

      const availContainer = document.getElementById('availability-list');
      if (listing.availability && listing.availability.length > 0) {
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        availContainer.innerHTML = listing.availability.map(a => `
          <div style="display: flex; justify-content: space-between; padding: 0.625rem 0; border-bottom: 1px solid var(--theme-border);">
            <span style="color: var(--theme-text-primary); font-weight: var(--weight-medium);">${days[a.day_of_week] || 'Day ' + a.day_of_week}</span>
            <span style="color: var(--theme-text-secondary);">${a.start_time || '--'} - ${a.end_time || '--'}</span>
          </div>
        `).join('');
      } else {
        availContainer.innerHTML = `<p style="color: var(--theme-text-secondary);">No availability set.</p>`;
      }
    };

    apiGet(`/listings/${listingId}`)
      .then(data => renderListing(data.data))
      .catch(err => {
        container.innerHTML = `<div class="alert alert--danger">${err.message}</div>`;
      });
  </script>
  <div id="profile-drawer-backdrop" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 998; opacity: 0; transition: opacity 0.3s ease;"></div>
  <aside id="profile-drawer" style="position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 85vw; background: var(--theme-card-bg); border-left: 1px solid var(--theme-border); z-index: 999; transform: translateX(100%); transition: transform 0.3s ease; display: flex; flex-direction: column; box-shadow: var(--shadow-xl);">
    <div style="padding: 1.25rem; border-bottom: 1px solid var(--theme-border); display: flex; align-items: center; justify-content: space-between;">
      <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">Account</h2>
      <button id="close-drawer" class="btn btn--ghost btn--sm" style="color: var(--theme-text-secondary); padding: 0.25rem;" aria-label="Close menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div id="drawer-auth-section" style="padding: 1.25rem; border-bottom: 1px solid var(--theme-border);">
      <div id="drawer-guest" style="display: none;">
        <p style="font-size: var(--text-sm); color: var(--theme-text-secondary); margin-bottom: 1rem;">Sign in to access your account, orders, and saved items.</p>
        <a href="/auth" class="btn btn--primary btn--block" style="text-decoration: none; text-align: center;">Sign in</a>
      </div>
      <div id="drawer-user" style="display: none;">
        <div class="flex items-center gap-3">
          <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--theme-bg-tertiary); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;" id="drawer-avatar-container">
            <svg id="drawer-avatar-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <img id="drawer-avatar-img" src="" alt="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
          </div>
          <div style="min-width: 0;">
            <p id="drawer-user-name" style="font-weight: var(--weight-semibold); color: var(--theme-text-primary); font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></p>
            <p id="drawer-user-email" style="font-size: var(--text-xs); color: var(--theme-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></p>
          </div>
        </div>
      </div>
    </div>
    <nav id="drawer-menu" style="flex: 1; overflow-y: auto; padding: 0.5rem 0;">
      <a href="/settings" class="drawer-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--theme-text-primary); text-decoration: none; font-size: var(--text-sm);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H2a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 12 2v.09a1.65 1.65 0 0 0 1.51 1H22a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Settings
      </a>
      <a href="/bookings" class="drawer-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--theme-text-primary); text-decoration: none; font-size: var(--text-sm);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Bookings
      </a>
      <a href="/cart" class="drawer-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--theme-text-primary); text-decoration: none; font-size: var(--text-sm);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        Cart
      </a>
      <a href="/reviews" class="drawer-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--theme-text-primary); text-decoration: none; font-size: var(--text-sm);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Reviews
      </a>
      <a href="/account" class="drawer-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--theme-text-primary); text-decoration: none; font-size: var(--text-sm);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        My Account
      </a>
            <a href="/admin" id="drawer-admin-dashboard" class="drawer-link" style="display: none; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--theme-text-primary); text-decoration: none; font-size: var(--text-sm);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Admin Dashboard
      </a>
<a href="/provider" id="drawer-provider-dashboard" class="drawer-link" style="display: none; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--theme-text-primary); text-decoration: none; font-size: var(--text-sm);">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        Provider Dashboard
      </a>
<button id="drawer-logout" class="drawer-link" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: var(--color-danger); background: none; border: none; width: 100%; text-align: left; font-size: var(--text-sm); cursor: pointer; display: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Sign out
      </button>
    </nav>
  </aside>
</body>
</html>
