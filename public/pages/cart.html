<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Cart</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="cart">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
            <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <a href="/bookings" class="btn btn--ghost" style="color: var(--theme-text-secondary);">Bookings</a>
        <button id="logout-btn" class="btn btn--secondary btn--sm">Sign Out</button>
      </nav>
    </div>
    </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem; max-width: 800px;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">Your Cart</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Review your items before checkout.</p>

      <div id="cart-content">
        <div class="loading-spinner" style="margin: 2rem auto;"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js?v=16"></script>
  <script type="module">
    import { isAuthenticated, apiGet, apiDelete } from '/js/api.js';
    import { showToast } from '/js/app.js';

    if (!isAuthenticated()) {
      window.location.href = '/auth';
    }

    const container = document.getElementById('cart-content');

    const renderCart = (cart) => {
      if (!cart.items || cart.items.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__icon">🛒</div>
            <p class="empty-state__title">Your cart is empty</p>
            <p class="empty-state__description">Browse services and add items to your cart.</p>
            <a href="/search" class="btn btn--primary" style="margin-top: 1rem;">Explore Services</a>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="space-y-4">
          ${cart.items.map(item => `
            <div class="card" style="display: flex; justify-content: space-between; align-items: center; gap: 1rem;">
              <div style="flex: 1;">
                <h3 style="font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin: 0 0 0.25rem;">${item.listing_title || 'Item'}</h3>
                <p style="font-size: var(--text-sm); color: var(--theme-text-tertiary); margin: 0;">Qty: ${item.quantity} · ${new Intl.NumberFormat('en-NG', { style: 'currency', currency: item.currency || 'NGN' }).format(item.unit_price || item.base_price || 0)}</p>
              </div>
              <button class="btn btn--danger btn--sm" data-cart-id="${item.id}">Remove</button>
            </div>
          `).join('')}
        </div>
        <div class="card" style="margin-top: 1.5rem;">
          <div class="flex items-center justify-between" style="margin-bottom: 1rem;">
            <span style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary);">Subtotal</span>
            <span style="font-size: var(--text-lg); font-weight: var(--weight-bold); color: var(--theme-accent);">${new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN' }).format(cart.subtotal || 0)}</span>
          </div>
          <a href="/checkout" class="btn btn--primary btn--block">Proceed to Checkout</a>
        </div>
      `;

      container.querySelectorAll('[data-cart-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const cartId = btn.dataset.cartId;
          try {
            await apiDelete(`/cart/items/${cartId}`);
            showToast('Item removed from cart', 'success');
            loadCart();
          } catch (err) {
            showToast(err.message || 'Failed to remove item', 'error');
          }
        });
      });
    };

    const loadCart = async () => {
      container.innerHTML = '<div class="loading-spinner" style="margin: 2rem auto;"></div>';
      try {
        const data = await apiGet('/cart');
        renderCart(data.data);
      } catch (err) {
        container.innerHTML = `<div class="alert alert--danger">${err.message}</div>`;
      }
    };

    loadCart();
  </script>
</body>
</html>
