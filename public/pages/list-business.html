<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — List Your Business</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="list-business">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
        <button id="profile-btn" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.25rem;" aria-label="Account menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem; max-width: 680px;">
      <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">List Your Business</h1>
      <p style="color: var(--theme-text-secondary); margin-bottom: 2rem;">Get your business discovered on noLIDA.</p>

      <div id="business-flow">
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg); margin-bottom: 1.5rem;">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Business Authorization Required</h2>
          <p style="color: var(--theme-text-secondary); line-height: var(--leading-relaxed); margin-bottom: 1rem;">To list your business on noLIDA, you need an authorization code. Contact us on WhatsApp to request your code.</p>
          <a href="https://wa.me/2347051679159?text=Hello%20noLIDA,%20I%20would%20like%20to%20request%20an%20authorization%20code%20to%20list%20my%20business." target="_blank" rel="noopener noreferrer" class="btn btn--primary" style="display: inline-flex; align-items: center; gap: 0.5rem;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Contact on WhatsApp
          </a>
        </div>

        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg);">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Enter Authorization Code</h2>
          <form id="auth-code-form">
            <div class="form-group">
              <label class="form-label form-label--required" for="auth-code">Authorization Code</label>
              <input type="text" id="auth-code" name="code" class="form-input" placeholder="NLDA-XXXX-XXXX" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text); text-transform: uppercase; letter-spacing: 0.1em;">
            </div>
            <button type="submit" class="btn btn--primary btn--block">Verify Code</button>
          </form>
        </div>
      </div>

      <div id="business-submission" style="display: none;">
        <div class="card" style="padding: 1.5rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg); margin-bottom: 1.5rem;">
          <h2 style="font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--theme-text-primary); margin-bottom: 1rem;">Business Information</h2>
          <form id="business-form">
            <div class="form-group">
              <label class="form-label form-label--required" for="business-name">Business Name</label>
              <input type="text" id="business-name" name="businessName" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            </div>
            <div class="form-group">
              <label class="form-label form-label--required" for="business-category">Category</label>
              <select id="business-category" name="categoryId" class="form-input" required style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
                <option value="">Select a category</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="business-description">Description</label>
              <textarea id="business-description" name="description" rows="4" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text); resize: vertical;"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label" for="business-phone">Business Phone</label>
              <input type="tel" id="business-phone" name="businessPhone" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            </div>
            <div class="form-group">
              <label class="form-label" for="business-email">Business Email</label>
              <input type="email" id="business-email" name="businessEmail" class="form-input" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            </div>
            <div class="form-group">
              <label class="form-label" for="business-website">Website</label>
              <input type="url" id="business-website" name="website" class="form-input" placeholder="https://..." style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            </div>
            <div class="form-group">
              <label class="form-label" for="business-location">Location</label>
              <input type="text" id="business-location" name="location" class="form-input" placeholder="City, State" style="background: var(--theme-input-bg); border-color: var(--theme-input-border); color: var(--theme-input-text);">
            </div>
            <button type="submit" class="btn btn--primary btn--block">Submit for Review</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js?v=16"></script>
  <script type="module">
    import { isAuthenticated, apiGet, apiPost } from '/js/api.js';

    const showToast = (message, type = 'info', duration = 3000) => {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.style.cssText = 'position: fixed; top: 1rem; right: 1rem; z-index: 400; display: flex; flex-direction: column; gap: 0.5rem;';
        document.body.appendChild(container);
      }
      const toast = document.createElement('div');
      toast.className = 'card';
      const borderColor = type === 'error' ? 'var(--color-danger)' : type === 'success' ? 'var(--color-success)' : 'var(--color-accent)';
      toast.style.cssText = `padding: 0.75rem 1rem; border-left: 4px solid ${borderColor}; box-shadow: var(--shadow-md); font-size: var(--text-sm); color: var(--theme-text-primary);`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, duration);
    };

    if (!isAuthenticated()) {
      window.location.href = '/auth';
    }

    const authCodeForm = document.getElementById('auth-code-form');
    const businessFlow = document.getElementById('business-submission');
    const authFlow = document.getElementById('business-flow');

    const loadCategories = async () => {
      try {
        const data = await apiGet('/categories');
        const categories = data.data || [];
        const select = document.getElementById('business-category');
        categories.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat.id;
          option.textContent = cat.name;
          select.appendChild(option);
        });
      } catch (err) {
        console.error('Failed to load categories:', err);
      }
    };

    if (authCodeForm) {
      authCodeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = authCodeForm.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></div> Verifying...';

        try {
          const code = authCodeForm.code.value.trim();
          await apiPost('/authorization-codes/validate', { code });
          showToast('Authorization code verified', 'success');
          authFlow.style.display = 'none';
          businessFlow.style.display = 'block';
          loadCategories();
        } catch (err) {
          showToast(err.message || 'Invalid authorization code', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Verify Code';
        }
      });
    }

    const businessForm = document.getElementById('business-form');
    if (businessForm) {
      businessForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = businessForm.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:0.5rem;"></div> Submitting...';

        try {
          const formData = new FormData(businessForm);
          await apiPost('/business-submissions', {
            businessName: formData.get('businessName'),
            categoryId: parseInt(formData.get('categoryId')),
            description: formData.get('description'),
            businessPhone: formData.get('businessPhone'),
            businessEmail: formData.get('businessEmail'),
            website: formData.get('website'),
            location: formData.get('location'),
          });
          showToast('Business submitted for review', 'success');
          businessForm.reset();
          setTimeout(() => {
            window.location.href = '/';
          }, 2000);
        } catch (err) {
          showToast(err.message || 'Failed to submit business', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Submit for Review';
        }
      });
    }
  </script>
</body>
</html>
