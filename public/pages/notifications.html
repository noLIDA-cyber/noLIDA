<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>noLIDA — Notifications</title>
  <link rel="stylesheet" href="/css/variables.css?v=16">
  <link rel="stylesheet" href="/css/theme.css?v=16">
  <link rel="stylesheet" href="/css/reset.css?v=16">
  <link rel="stylesheet" href="/css/base.css?v=16">
  <link rel="stylesheet" href="/css/components.css?v=16">
  <link rel="stylesheet" href="/css/utilities.css?v=16">
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
</head>
<body data-page="notifications">
  <header class="header" style="position: fixed; top: 0; left: 0; right: 0; height: var(--header-height); background: var(--theme-header-bg); border-bottom: 1px solid var(--theme-border); z-index: var(--z-sticky); display: flex; align-items: center; backdrop-filter: blur(12px);">
    <div class="container flex items-center justify-between" style="height: 100%;">
      <a href="/" class="flex items-center gap-2" style="text-decoration: none;">
        <img src="/assets/images/noLIDA.jpg" alt="noLIDA" style="height: 32px; width: auto;">
        <span style="font-size: var(--text-xl); font-weight: var(--weight-bold); color: var(--theme-text-primary);">noLIDA</span>
      </a>
      <nav class="nav-links flex items-center gap-2 sm:gap-3">
        <a href="/" class="btn btn--ghost" style="color: var(--theme-text-secondary); display: inline-flex; align-items: center; gap: 0.25rem;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
          Home
        </a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container" style="padding-top: 2rem; padding-bottom: 2rem; max-width: 680px;">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 style="font-size: var(--text-2xl); font-weight: var(--weight-bold); color: var(--theme-text-primary); margin-bottom: 0.5rem;">Notifications</h1>
          <p style="color: var(--theme-text-secondary);">Stay updated on your activity.</p>
        </div>
        <button id="mark-all-read" class="btn btn--secondary btn--sm">Mark all as read</button>
      </div>
      <div id="notifications-list">
        <div class="loading-spinner" style="margin: 2rem auto;"></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/app.js?v=16"></script>
  <script type="module">
    import { apiGet, apiPatch, isAuthenticated } from '/js/api.js';
    import { showToast } from '/js/app.js';

    if (!isAuthenticated()) {
      window.location.href = '/auth';
    }

    const list = document.getElementById('notifications-list');
    const markAllBtn = document.getElementById('mark-all-read');

    const load = async () => {
      try {
        const data = await apiGet('/notifications');
        const notifications = data.data || [];
        if (notifications.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__icon">🔔</div>
              <p class="empty-state__title">No notifications yet</p>
              <p class="empty-state__description">We'll notify you when something important happens.</p>
            </div>`;
          return;
        }
        list.innerHTML = notifications.map(n => `
          <div class="card" style="padding: 1rem; border: 1px solid var(--theme-border); background: var(--theme-card-bg); margin-bottom: 0.75rem; ${n.read ? 'opacity: 0.75;' : ''}">
            <div style="display: flex; align-items: flex-start; gap: 0.75rem;">
              <div style="width: 8px; height: 8px; border-radius: 50%; background: ${n.read ? 'transparent' : 'var(--color-danger)'}; margin-top: 0.5rem; flex-shrink: 0;"></div>
              <div style="flex: 1; min-width: 0;">
                <p style="font-weight: var(--weight-medium); color: var(--theme-text-primary); font-size: var(--text-sm); margin-bottom: 0.25rem;">${n.title}</p>
                <p style="font-size: var(--text-sm); color: var(--theme-text-secondary); margin-bottom: 0.5rem;">${n.body || ''}</p>
                <p style="font-size: var(--text-xs); color: var(--theme-text-tertiary);">${new Date(n.created_at).toLocaleString()}</p>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        list.innerHTML = `<div class="alert alert--danger">${error.message}</div>`;
      }
    };

    if (markAllBtn) {
      markAllBtn.addEventListener('click', async () => {
        try {
          await apiPatch('/notifications/read-all');
          showToast('All notifications marked as read', 'success');
          load();
        } catch (error) {
          showToast(error.message || 'Failed', 'error');
        }
      });
    }

    load();
  </script>
</body>
</html>
